services:
  # Backend Service
  - type: web
    name: slidesync-backend
    env: node
    rootDirectory: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  # Frontend Service
  - type: web
    name: slidesync-frontend
    env: static
    rootDirectory: frontend
    buildCommand: echo "No build needed"
    staticPublishPath: .
    envVars:
      - key: BACKEND_URL
        value: https://slidesync-backend.onrender.com
