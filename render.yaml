services:
  # Backend Service
  - type: web
    name: slidesync-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  # Frontend Service
  - type: web
    name: slidesync-frontend
    env: static
    buildCommand: echo "No build needed"
    staticPublishPath: ./frontend
    envVars:
      - key: BACKEND_URL
        value: https://slidesync-backend.onrender.com
