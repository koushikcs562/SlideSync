<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideSync - Convert Jira to PPT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/libs/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0A192F] text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 relative">

    <div id="authOverlay" class="absolute inset-0 bg-[#0A192F]/95 z-50 flex items-center justify-center p-4">
        <div class="bg-[#112240] p-8 rounded-2xl max-w-md w-full border border-slate-700/50 shadow-2xl">
            <div class="flex items-center space-x-2 mb-6 justify-center">
                <span class="text-2xl">📊</span>
                <h2 class="text-2xl font-bold text-sky-400">SlideSync Auth</h2>
            </div>

            <div class="flex border-b border-slate-700 mb-6">
                <button id="tabLogin" class="flex-1 pb-2 font-medium text-sky-400 border-b-2 border-sky-400 focus:outline-none">Login</button>
                <button id="tabSignup" class="flex-1 pb-2 font-medium text-slate-400 border-b-transparent focus:outline-none">Sign Up</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
                    <input type="email" id="authEmail" placeholder="you@company.com" class="w-full bg-[#0A192F] border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-sky-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                    <input type="password" id="authPassword" placeholder="••••••••" class="w-full bg-[#0A192F] border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-sky-500 transition-colors">
                </div>
                
                <button id="authSubmitBtn" class="w-full bg-sky-500 hover:bg-sky-600 active:bg-sky-700 text-white font-semibold py-3 rounded-lg mt-2 transition-all shadow-lg shadow-sky-500/20">
                    Sign In to Account
                </button>
            </div>
        </div>
    </div>

    <main class="w-full max-w-2xl bg-[#112240] rounded-2xl shadow-2xl border border-slate-800/80 overflow-hidden relative p-8">
        
        <header class="flex justify-between items-center mb-6">
            <div class="flex items-center space-x-3">
                <div class="bg-sky-500/10 p-2 rounded-lg border border-sky-500/20 text-sky-400 font-bold text-xl">
                    🔀
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                        SlideSync <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full">SaaS Engine</span>
                    </h1>
                    <p class="text-xs text-slate-400">Transform raw development notes into polished executive decks instantly.</p>
                </div>
            </div>
            <button id="logoutBtn" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-md transition-colors text-slate-300">
                Log Out
            </button>
        </header>

        <section class="space-y-4">
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="block text-xs font-semibold tracking-wider text-slate-400 uppercase">Raw Engineering Updates / Ticket Logs</label>
                    <span id="displayUserMetrics" class="text-xs text-sky-400 font-medium bg-sky-500/5 px-2.5 py-1 rounded-md border border-sky-500/10">Loading profile...</span>
                </div>
                <textarea id="jiraInput" rows="7" 
                    placeholder="Paste messy communication blocks, sprint updates, or Slack outputs here..."
                    class="w-full bg-[#0A192F] border border-slate-800 rounded-xl p-4 text-sm text-slate-200 focus:outline-none focus:border-sky-500/50 resize-none font-mono placeholder:text-slate-600 transition-all shadow-inner"></textarea>
            </div>

            <button id="generateBtn" class="w-full bg-sky-500 hover:bg-sky-600 active:scale-[0.99] text-white font-semibold py-3.5 rounded-xl transition-all shadow-xl shadow-sky-500/10 flex items-center justify-center space-x-2">
                <span>⚡</span> <span>Convert to PowerPoint (.pptx)</span>
            </button>

            <footer class="bg-[#0A192F]/60 border border-slate-800/60 rounded-xl p-3 text-center">
                <p class="text-xs text-slate-500 flex items-center justify-center gap-2">
                    🔒 <span class="font-medium text-slate-400">100% Secure Enterprise Guardrails Enforced</span>
                </p>
                <p class="text-[10px] text-slate-600 mt-0.5">Payload arrays stream over stateless API gateways and are never cached or utilized for general model instruction.</p>
            </footer>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
